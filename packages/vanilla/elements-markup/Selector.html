<!-- docs: Choose one value from a moderate list with a native select control. -->
<!-- attributes:
label*:str|—|Visible and accessible field label.
value:str|—|Selected option value, reflected after native change events.
size:sm,md,lg|md|Control size matching Selector size.
variant:input,ghost|input|Bordered input or ghost toolbar presentation.
status:none,error,success|none|Current validation state.
description:str|—|Supporting field description.
status-message:str|—|Validation message associated with the native select.
is-required/required:bool|false|Marks the native select required.
is-disabled/disabled:bool|false|Disables the native select.
is-read-only/readonly:bool|false|Prevents value changes while preserving focus and submission.
html-name/name:str|—|Native form field name.
-->
<!-- slots:
label*:Visible field label.
default*:Native option and optgroup children.
description:Supporting field description.
status-message:Validation message.
-->
<!-- events:
change:Native selection event; value is reflected to the host.
-->
<!-- properties:attrs→camelCase;readonly:form,validity,validationMessage,willValidate -->
<!-- variant: default -->
<ax-selector label="Workspace" html-name="workspace">
  <option value="design">Design systems</option>
  <option value="tools">Developer tools</option>
</ax-selector>
<!-- variant: compact -->
<ax-selector label="Status" size="sm">
  <option>Active</option>
  <option>Paused</option>
</ax-selector>
