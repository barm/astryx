<!-- docs: Collect a single line of text with an associated visible label. -->
<!-- attributes:
type:text,password,email|text|Native single-line input type.
label*:str|—|Visible and accessible field label.
value:str|—|Current value, reflected after native input events.
size:sm,md,lg|md|Field size matching TextInput size.
description:str|—|Supporting field description.
status:none,error,warning,success|none|Validation state; none renders no status treatment.
status-message:str|—|Validation message associated with the native input.
is-required/required:bool|false|Marks the native input required.
is-disabled/disabled:bool|false|Disables the native input.
is-read-only/readonly:bool|false|Makes the native input read-only.
placeholder:str|—|Native placeholder text.
html-name/name:str|—|Native form field name.
auto-complete/autocomplete:str|—|Native autocomplete hint.
-->
<!-- slots:
label*:Visible field label.
description:Supporting field description.
status-message:Validation message.
-->
<!-- events:
input:Native input event; value is reflected before bubbling completes.
change:Native change event; value is reflected to the host.
-->
<!-- properties:attrs→camelCase;readonly:form,validity,validationMessage,willValidate -->
<!-- variant: default -->
<ax-text-input
  label="Project name"
  html-name="project"
  placeholder="Astryx"
></ax-text-input>
<!-- variant: error -->
<ax-text-input
  type="email"
  label="Email"
  status="error"
  status-message="Enter a valid email address."

<!-- state-recipes:start -->
<!-- variant: password-strength-and-visibility -->
<div>
  <ax-text-input
    id="password-recipe-field"
    type="password"
    label="Password"
    html-name="password"
    auto-complete="new-password"
    description="Use at least twelve characters."
  ></ax-text-input>
  <button
    id="password-recipe-toggle"
    type="button"
    aria-controls="password-recipe-field"
    aria-pressed="false"
  >Show password</button>
  <ax-progress-bar
    id="password-recipe-strength"
    label="Password strength"
    value="0"
    max="100"
    has-value-label
  ></ax-progress-bar>
  <p id="password-recipe-status" role="status" aria-live="polite">
    Password not entered.
  </p>
</div>
<script>
  (() => {
    const field = document.querySelector('#password-recipe-field');
    const toggle = document.querySelector('#password-recipe-toggle');
    const meter = document.querySelector('#password-recipe-strength');
    const status = document.querySelector('#password-recipe-status');
    const strength = value =>
      value.length >= 12 ? [100, 'Strong'] : value.length >= 8 ? [60, 'Medium'] : value ? [25, 'Weak'] : [0, 'Not entered'];
    const update = () => {
      const [value, label] = strength(field.value ?? '');
      meter.setAttribute('value', String(value));
      meter.setAttribute('variant', value >= 100 ? 'success' : value >= 60 ? 'warning' : value ? 'error' : 'neutral');
      status.textContent = 'Password strength: ' + label + '.';
    };
    field.addEventListener('input', update);
    toggle.addEventListener('click', () => {
      const visible = field.getAttribute('type') === 'text';
      field.setAttribute('type', visible ? 'password' : 'text');
      toggle.setAttribute('aria-pressed', String(!visible));
      toggle.textContent = visible ? 'Show password' : 'Hide password';
    });
    update();
  })();
</script>
<!-- state-recipes:end -->
