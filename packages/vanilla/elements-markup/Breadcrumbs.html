<!-- docs: Show a short navigation trail above the page heading and mark the current location. -->
<!-- attributes:
separator:str|/|Visible separator between authored breadcrumb items.
variant:default,supporting|default|Default or supporting visual treatment.
label:str|Breadcrumb|Accessible label for the navigation landmark.
-->
<!-- slots:
default*:Plain link and current-page children; Breadcrumbs generates list items, separators, and BEM classes.
-->
<!-- events:
none
-->
<!-- properties:attrs→camelCase -->
<!-- variant: default -->
<ax-breadcrumbs>
  <a href="#home">Home</a>
  <span>Projects</span>
</ax-breadcrumbs>
<!-- variant: supporting -->
<ax-breadcrumbs variant="supporting" label="Settings breadcrumb" separator="›">
  <a href="#settings">Settings</a>
  <strong>Notifications</strong>
</ax-breadcrumbs>
