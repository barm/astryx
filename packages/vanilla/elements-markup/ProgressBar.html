<!-- docs: Communicate determinate or indeterminate task progress with native progressbar semantics. -->
<!-- attributes:
label*:string|—|Required accessible operation label.
value:string|0|Current determinate value.
max:string|100|Maximum determinate value.
is-label-hidden:boolean|absent|Visually hides the label while preserving its accessible name.
has-value-label:boolean|absent|Shows a percentage value next to the label.
variant:accent, success, warning, error, neutral|accent|Semantic progress color.
is-indeterminate:boolean|absent|Shows progress when completion cannot be measured.
is-disabled (disabled):boolean|absent|Uses disabled visual treatment.
-->
<!-- slots:
label:Visible operation label; overrides the label attribute.
-->
<!-- events:
none
-->
<!-- properties: attrs/aliases: camelCase properties -->
<!-- variant: determinate -->
<ax-progress-bar label="Uploading files" value="72" variant="success" has-value-label></ax-progress-bar>
<!-- variant: indeterminate -->
<ax-progress-bar label="Processing report" is-indeterminate></ax-progress-bar>
