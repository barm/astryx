<!-- docs: Reveal rich supplementary content from hover or keyboard focus. -->
<!-- attributes:
content*:str|—|Rich hover-card content.
label:str|—|Accessible dialog name; without one the surface is a group.
placement:above,below,start,end|above|Logical surface placement.
alignment:start,center,end|center|Logical surface alignment.
delay:str|300|Opening delay in milliseconds.
hide-delay:str|200|Closing delay in milliseconds.
focus-trigger:auto,always,never|auto|Keyboard focus trigger policy.
touch-trigger:auto,tap,none|auto|Touch activation policy.
is-enabled:bool|true|Enabled by default; set false to disable.
is-open/open:bool|false|Controlled open state.
-->
<!-- slots:
default*:Hoverable focusable trigger.
content*:Rich supplementary content.
-->
<!-- events:
astryx:open-change:Emitted with {isOpen} whenever the hover card opens or closes.
-->
<!-- methods:
show():Show hover.
close():Hide hover.
-->
<!-- properties:attrs→camelCase -->
<!-- variant: profile -->
<ax-hover-card content="Designer"><button type="button">Jordan</button></ax-hover-card>
<!-- variant: link -->
<ax-hover-card content="Roadmap" placement="below"><a href="#roadmap">View</a></ax-hover-card>
<!-- variant: state-open -->
<ax-hover-card content="I" is-open><button>Open</button></ax-hover-card>
