<!-- docs: Open authored images in a modal viewer with gallery navigation and focus restoration. -->
<!-- attributes:
src*:str|—|Primary image source.
alt:str|—|Primary image alternative text.
caption:str|—|Visible image caption.
thumbnail-src:str|—|Trigger thumbnail source.
trigger-label:str|Open image viewer|Accessible trigger name.
label:str|Image viewer|Accessible dialog name.
lightbox-id:str|—|Native dialog identifier.
is-open/open:bool|false|Controlled viewer open state.
index:str|0|Current zero-based image index.
has-zoom:bool|false|Reserved image zoom capability.
-->
<!-- slots:
thumbnail:Trigger thumbnail content.
default*:Authored gallery media figures.
caption:Caption for generated single-image media.
-->
<!-- events:
astryx:open-change:Emitted with {isOpen} whenever the modal viewer opens or closes.
astryx:index-change:Emitted with {index} after gallery navigation changes the image.
-->
<!-- methods:
show():Open modal.
close():Close modal.
next():Move next.
previous():Move previous.
-->
<!-- properties:attrs→camelCase -->
<!-- variant: single -->
<ax-lightbox src="data:image/svg+xml,%3Csvg/%3E" alt="Launch"></ax-lightbox>
<!-- variant: gallery -->
<ax-lightbox><figure><img src="data:image/svg+xml,%3Csvg/%3E" alt="One" /></figure><figure><img src="data:image/svg+xml,%3Csvg/%3E" alt="Two" /></figure></ax-lightbox>
