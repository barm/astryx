title*/data-ax-title:str|—|Required primary message; consumed so the host never shows a native title tooltip.
description:str|—|Optional explanatory text.

is-compact:bool|false|Uses reduced spacing for constrained surfaces.
-->
<!-- slots:
title*:Primary message; overrides the title attribute.
description:Supporting explanation.
icon:Decorative icon or illustration.

<!-- properties:attrs→camelCase -->
<!-- variant: default -->
<ax-empty-state title="No projects yet">
  <span slot="icon">＋</span>
  <ax-button slot="actions" variant="primary">Create project</ax-button>
</ax-empty-state>
<!-- variant: compact -->
<ax-empty-state title="No matching results" description="Try a broader search." is-compact>
  <ax-button slot="actions">Clear filters</ax-button>
</ax-empty-state>
