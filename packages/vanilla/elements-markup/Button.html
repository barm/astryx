<!-- docs: Trigger an action with primary, secondary, ghost, or destructive emphasis. -->
<!-- attributes:
label*:str|—|Visible button label when no child content is authored.
variant:primary,secondary,ghost,destructive|secondary|Visual emphasis matching Button variant.
size:sm,md,lg|md|Control size matching Button size.
type:button,submit,reset|button|Native button type.
is-disabled/disabled:bool|false|Disables native activation.
name:str|—|Native form field name.
value:str|—|Native form submission value.
form:str|—|ID of the associated form.
href:str|—|Optional native link destination.
-->
<!-- slots:
default*:Visible button label and inline content.
-->
<!-- events:
click:Native activation event from the inner button or link.
-->
<!-- properties:attrs→camelCase;readonly:validity,validationMessage,willValidate -->
<!-- variant: primary -->
<ax-button variant="primary">
  Continue
</ax-button>
<!-- variant: disabled-label -->
<ax-button label="Continue" variant="primary" is-disabled></ax-button>
