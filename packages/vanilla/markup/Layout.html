<!-- docs: Use <main class="ax-layout__content"> only when Layout owns the page's single main region; use <div class="ax-layout__content"> for bounded or nested layouts. -->
<!-- variant: page-main -->
<div class="ax-layout">
  <header class="ax-layout__header">
    <h1 class="ax-heading ax-heading--1">Page title</h1>
  </header>
  <main class="ax-layout__content"><p class="ax-text">Page content</p></main>
  <footer class="ax-layout__footer">
    <span class="ax-text ax-text--supporting">Footer</span>
  </footer>
</div>

<!-- variant: named-regions -->
<div class="ax-layout ax-layout--regions">
  <header class="ax-layout__header">
    <h2 class="ax-heading ax-heading--3">LayoutHeader</h2>
  </header>
  <aside
    class="ax-layout__panel ax-layout__panel--start"
    role="navigation"
    aria-label="Workspace navigation">
    <strong>LayoutPanel</strong>
    <nav class="ax-stack ax-stack--gap-2">
      <a class="ax-link" href="#overview">Overview</a
      ><a class="ax-link" href="#activity">Activity</a>
    </nav>
  </aside>
  <div class="ax-layout__content">
    <h2 class="ax-heading ax-heading--2">LayoutContent</h2>
    <p class="ax-text">
      Use named regions when content needs a header, a scrollable center, or
      logical start/end panels.
    </p>
  </div>
</div>
