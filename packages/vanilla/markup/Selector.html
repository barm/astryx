<!-- docs: Choose one value from a moderate list. Theme and mode hooks persist the active appearance across reloads. -->
<!-- variant: default -->
<div class="ax-selector">
  <label class="ax-selector__label" for="workspace-selector">Workspace</label>
  <span class="ax-selector__control">
    <select
      class="ax-selector__select"
      id="workspace-selector"
      name="workspace"
      aria-describedby="workspace-description">
      <option>Design systems</option>
      <option>Developer tools</option>
      <option>Business platform</option>
    </select>
    <span class="ax-selector__indicator" aria-hidden="true"></span>
  </span>
  <span class="ax-selector__description" id="workspace-description"
    >Choose where this project belongs.</span
  >
</div>

<!-- variant: compact -->
<div class="ax-selector ax-selector--sm">
  <label class="ax-selector__label" for="status-selector">Status</label>
  <span class="ax-selector__control">
    <select class="ax-selector__select" id="status-selector">
      <option>Active</option>
      <option>Paused</option>
      <option>Archived</option>
    </select>
    <span class="ax-selector__indicator" aria-hidden="true"></span>
  </span>
</div>

<!-- variant: error -->
<div class="ax-selector ax-selector--error">
  <label class="ax-selector__label" for="owner-selector">Owner</label>
  <span class="ax-selector__control">
    <select
      class="ax-selector__select"
      id="owner-selector"
      aria-invalid="true"
      aria-describedby="owner-status">
      <option value="">Choose an owner</option>
      <option>Alex Morgan</option>
      <option>Sam Rivera</option>
    </select>
    <span class="ax-selector__indicator" aria-hidden="true"></span>
  </span>
  <span class="ax-selector__description" id="owner-status"
    >Select an owner to continue.</span
  >
</div>

<!-- variant: ghost -->
<div class="ax-selector ax-selector--ghost">
  <span class="ax-selector__control">
    <select class="ax-selector__select" aria-label="Sort results">
      <option>Newest first</option>
      <option>Oldest first</option>
    </select>
    <span class="ax-selector__indicator" aria-hidden="true"></span>
  </span>
</div>

<!-- variant: theme-switcher -->
<div class="ax-selector">
  <label class="ax-selector__label" for="theme-selector">Theme</label>
  <span class="ax-selector__control">
    <select
      class="ax-selector__select"
      id="theme-selector"
      data-ax-theme-switch>
      <option value="neutral">Neutral</option>
      <option value="butter">Butter</option>
      <option value="y2k">Y2K</option>
      <option value="stone">Stone</option>
      <option value="matcha">Matcha</option>
      <option value="chocolate">Chocolate</option>
      <option value="gothic">Gothic</option>
    </select>
    <span class="ax-selector__indicator" aria-hidden="true"></span>
  </span>
</div>

<!-- variant: dark-mode-toggle -->
<button
  class="ax-button ax-button--secondary"
  type="button"
  data-ax-mode-toggle>
  Toggle light or dark mode
</button>
