<!doctype html>
<html lang="en" data-astryx-theme="neutral" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vanilla Astryx elements gallery</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.6.5/src/reset.css" />
    <link rel="stylesheet" href="../dist/astryx-vanilla.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.6.5/dist/theme.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-butter@0.6.5/dist/theme.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-y2k@0.6.5/dist/theme.css" />
    <style>
      @layer astryx-base {
        body {
          margin: 0;
        }
        .gallery {
          display: grid;
          gap: var(--spacing-6);
          padding: var(--spacing-6);
        }
        .gallery__matrix {
          display: grid;
          grid-template-columns: repeat(
            auto-fit,
            minmax(min(100%, 28rem), 1fr)
          );
          gap: var(--spacing-4);
        }
        .gallery__theme,
        .gallery__examples,
        .gallery__component {
          display: grid;
          gap: var(--spacing-4);
        }
        .gallery__theme {
          padding: var(--spacing-4);
          border: var(--border-width) solid var(--color-border);
          border-radius: var(--radius-container);
          background: var(--color-background-body);
          color: var(--color-text-primary);
        }
        .gallery__component {
          padding-block-end: var(--spacing-4);
          border-block-end: var(--border-width) solid var(--color-border);
        }
        .gallery__example {
          display: grid;
          gap: var(--spacing-2);
          align-items: start;
        }
        .gallery__theme[data-theme='light'] {
          color-scheme: light;
        }
        .gallery__theme[data-theme='dark'] {
          color-scheme: dark;
        }
        .gallery__theme .ax-tab,
        .gallery__component small {
          color: var(--color-text-primary);
        }
      }
    </style>
    <script defer src="../dist/astryx-vanilla.js"></script>
    <script defer src="../dist/astryx-elements.classic.js"></script>
  </head>
  <body>
    <main class="gallery">
      <header class="ax-stack ax-stack--gap-2">
        <h1 class="ax-heading ax-heading--1">Astryx custom elements</h1>
        <p class="ax-text ax-text--secondary">
          25 auto-discovered definitions rendered across neutral, butter, and
          Y2K in light and dark modes.
        </p>
      </header>
      <div class="gallery__matrix" id="gallery-matrix"></div>
    </main>

    <template id="gallery-content">
      <div class="gallery__examples">
        <section class="gallery__component" data-gallery-element="Avatar">
          <h3 class="ax-heading ax-heading--3">Avatar</h3>
          <div class="gallery__example" data-gallery-example="initials-status">
            <ax-avatar
              src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
              name="Ada Lovelace"
              alt="Ada Lovelace, Online">
              <ax-status-dot
                slot="status"
                variant="success"
                label="Online"></ax-status-dot>
            </ax-avatar>
          </div>
          <div class="gallery__example" data-gallery-example="linked-image">
            <ax-avatar
              href="#profile"
              src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
              name="Grace Hopper"
              size="lg"
              shape="rounded"></ax-avatar>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Badge">
          <h3 class="ax-heading ax-heading--3">Badge</h3>
          <div class="gallery__example" data-gallery-example="neutral">
            <ax-badge>Draft</ax-badge>
          </div>
          <div class="gallery__example" data-gallery-example="success-label">
            <ax-badge label="Ready" variant="success"></ax-badge>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Banner">
          <h3 class="ax-heading ax-heading--3">Banner</h3>
          <div class="gallery__example" data-gallery-example="information">
            <ax-banner status="info" title="Your trial ends in 5 days">
              <ax-button slot="end-content" variant="primary" size="sm"
                >View plans</ax-button
              >
            </ax-banner>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Breadcrumbs">
          <h3 class="ax-heading ax-heading--3">Breadcrumbs</h3>
          <div class="gallery__example" data-gallery-example="default">
            <ax-breadcrumbs>
              <li class="ax-breadcrumbs__item">
                <span class="ax-breadcrumbs__separator" aria-hidden="true"
                  >/</span
                ><a
                  class="ax-breadcrumbs__link"
                  href="#home"
                  style="color: var(--color-text-primary)"
                  >Home</a
                >
              </li>
              <li class="ax-breadcrumbs__item">
                <span class="ax-breadcrumbs__separator" aria-hidden="true"
                  >/</span
                ><span class="ax-breadcrumbs__current" aria-current="page"
                  >Projects</span
                >
              </li>
            </ax-breadcrumbs>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Button">
          <h3 class="ax-heading ax-heading--3">Button</h3>
          <div class="gallery__example" data-gallery-example="primary">
            <ax-button variant="primary"> Continue </ax-button>
          </div>
          <div class="gallery__example" data-gallery-example="disabled-label">
            <ax-button
              label="Continue"
              variant="primary"
              is-disabled></ax-button>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Card">
          <h3 class="ax-heading ax-heading--3">Card</h3>
          <div class="gallery__example" data-gallery-example="default">
            <ax-card>
              <h2 slot="header">Card title</h2>
              <p>Card content</p>
            </ax-card>
          </div>
          <div class="gallery__example" data-gallery-example="elevated">
            <ax-card elevation="low">
              <p>Elevated card</p>
              <ax-button slot="footer" variant="primary">Action</ax-button>
            </ax-card>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Dialog">
          <h3 class="ax-heading ax-heading--3">Dialog</h3>
          <div class="gallery__example" data-gallery-example="open-and-close">
            <ax-button data-ax-dialog-open="confirm-dialog"
              >Open dialog</ax-button
            >
            <ax-dialog dialog-id="confirm-dialog">
              <span slot="title">Archive project?</span>
              <p>You can restore this project later.</p>
              <ax-button slot="footer" data-ax-dialog-close>Cancel</ax-button>
            </ax-dialog>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Divider">
          <h3 class="ax-heading ax-heading--3">Divider</h3>
          <div class="gallery__example" data-gallery-example="horizontal">
            <ax-divider></ax-divider>
          </div>
          <div class="gallery__example" data-gallery-example="strong">
            <ax-divider variant="strong"></ax-divider>
          </div>
          <div class="gallery__example" data-gallery-example="labeled">
            <ax-divider label="Or"></ax-divider>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="EmptyState">
          <h3 class="ax-heading ax-heading--3">EmptyState</h3>
          <div class="gallery__example" data-gallery-example="default">
            <ax-empty-state title="No projects yet">
              <span slot="icon">＋</span>
              <ax-button slot="actions" variant="primary"
                >Create project</ax-button
              >
            </ax-empty-state>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Heading">
          <h3 class="ax-heading ax-heading--3">Heading</h3>
          <div class="gallery__example" data-gallery-example="page-title">
            <ax-heading level="1">Page title</ax-heading>
          </div>
          <div class="gallery__example" data-gallery-example="section-title">
            <ax-heading level="2" color="secondary">Section title</ax-heading>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Layout">
          <h3 class="ax-heading ax-heading--3">Layout</h3>
          <div class="gallery__example" data-gallery-example="page-shell">
            <ax-layout>
              <h1 slot="header">Page title</h1>
              <p>Page content</p>
              <small slot="footer">Footer</small>
            </ax-layout>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Link">
          <h3 class="ax-heading ax-heading--3">Link</h3>
          <div class="gallery__example" data-gallery-example="default">
            <ax-link href="#destination">Learn more</ax-link>
          </div>
          <div class="gallery__example" data-gallery-example="disabled">
            <ax-link is-disabled>Unavailable</ax-link>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="ProgressBar">
          <h3 class="ax-heading ax-heading--3">ProgressBar</h3>
          <div class="gallery__example" data-gallery-example="indeterminate">
            <ax-progress-bar
              label="Processing report"
              is-indeterminate></ax-progress-bar>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Selector">
          <h3 class="ax-heading ax-heading--3">Selector</h3>
          <div class="gallery__example" data-gallery-example="default">
            <ax-selector label="Workspace" html-name="workspace">
              <option value="design">Design systems</option>
              <option value="tools">Developer tools</option>
            </ax-selector>
          </div>
          <div class="gallery__example" data-gallery-example="compact">
            <ax-selector label="Status" size="sm">
              <option>Active</option>
              <option>Paused</option>
            </ax-selector>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="SideNav">
          <h3 class="ax-heading ax-heading--3">SideNav</h3>
          <div class="gallery__example" data-gallery-example="default">
            <ax-side-nav label="Application navigation">
              <a slot="header" class="ax-side-nav__brand" href="#">Astryx</a>
              <a class="ax-side-nav__item" href="#" aria-current="page"
                >Overview</a
              >
            </ax-side-nav>
          </div>
          <div class="gallery__example" data-gallery-example="collapsed">
            <ax-side-nav label="Collapsed navigation" is-collapsed>
              <a
                slot="header"
                class="ax-side-nav__brand"
                href="#"
                aria-label="Astryx"
                >A</a
              >
              <a class="ax-side-nav__item" href="#" aria-label="Overview">●</a>
            </ax-side-nav>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Skeleton">
          <h3 class="ax-heading ax-heading--3">Skeleton</h3>
          <div class="gallery__example" data-gallery-example="text">
            <ax-skeleton width="100%" height="12px"></ax-skeleton>
          </div>
          <div class="gallery__example" data-gallery-example="avatar">
            <ax-skeleton
              width="40px"
              height="40px"
              radius="rounded"></ax-skeleton>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Stack">
          <h3 class="ax-heading ax-heading--3">Stack</h3>
          <div class="gallery__example" data-gallery-example="vertical">
            <ax-stack gap="3">
              <span>First item</span>
              <span>Second item</span>
            </ax-stack>
          </div>
          <div class="gallery__example" data-gallery-example="horizontal-wrap">
            <ax-stack direction="horizontal" gap="2" wrap="wrap">
              <span>One</span>
              <span>Two</span>
              <span>Three</span>
            </ax-stack>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="StatusDot">
          <h3 class="ax-heading ax-heading--3">StatusDot</h3>
          <div class="gallery__example" data-gallery-example="online">
            <ax-status-dot variant="success" label="Online"></ax-status-dot>
          </div>
          <div class="gallery__example" data-gallery-example="incident">
            <ax-status-dot
              variant="error"
              label="Service incident"
              is-pulsing></ax-status-dot>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Table">
          <h3 class="ax-heading ax-heading--3">Table</h3>
          <div class="gallery__example" data-gallery-example="balanced">
            <ax-table label="Project table" has-hover>
              <table>
                <thead>
                  <tr>
                    <th scope="col" style="color: var(--color-text-primary)">
                      Project
                    </th>
                    <th scope="col" style="color: var(--color-text-primary)">
                      Status
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Astryx</td>
                    <td>Active</td>
                  </tr>
                </tbody>
              </table>
            </ax-table>
          </div>
          <div class="gallery__example" data-gallery-example="compact-grid">
            <ax-table
              label="Release table"
              density="compact"
              dividers="grid"
              is-striped>
              <table>
                <thead>
                  <tr>
                    <th scope="col" style="color: var(--color-text-primary)">
                      Version
                    </th>
                    <th scope="col" style="color: var(--color-text-primary)">
                      Channel
                    </th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>0.6.5</td>
                    <td>Stable</td>
                  </tr>
                </tbody>
              </table>
            </ax-table>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="TabList">
          <h3 class="ax-heading ax-heading--3">TabList</h3>
          <div class="gallery__example" data-gallery-example="panels">
            <ax-tab-list value="overview" label="Project views">
              <ax-tab value="overview" panel-id="panel-overview"
                >Overview</ax-tab
              >
              <ax-tab value="activity" panel-id="panel-activity"
                >Activity</ax-tab
              >
              <section slot="panels" id="panel-overview">
                Overview content
              </section>
              <section slot="panels" id="panel-activity">
                Activity content
              </section>
            </ax-tab-list>
          </div>
          <div class="gallery__example" data-gallery-example="fill">
            <ax-tab-list layout="fill">
              <ax-tab value="one">One</ax-tab>
              <ax-tab value="two">Two</ax-tab>
            </ax-tab-list>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Text">
          <h3 class="ax-heading ax-heading--3">Text</h3>
          <div class="gallery__example" data-gallery-example="body">
            <ax-text as="p">Readable body copy.</ax-text>
          </div>
          <div class="gallery__example" data-gallery-example="code">
            <ax-text as="code" type="code">const ready = true;</ax-text>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="TextInput">
          <h3 class="ax-heading ax-heading--3">TextInput</h3>
          <div class="gallery__example" data-gallery-example="default">
            <ax-text-input
              label="Project name"
              html-name="project"
              placeholder="Astryx"></ax-text-input>
          </div>
          <div class="gallery__example" data-gallery-example="error">
            <ax-text-input
              type="email"
              label="Email"
              status="error"
              status-message="Enter a valid email address."></ax-text-input>
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="Theme">
          <h3 class="ax-heading ax-heading--3">Theme</h3>
          <div class="gallery__example" data-gallery-example="neutral-light">
            <ax-theme theme="neutral" mode="light"
              ><p class="ax-text">Neutral theme</p></ax-theme
            >
          </div>
          <div class="gallery__example" data-gallery-example="butter-dark">
            <ax-theme theme="butter" mode="dark"
              ><p class="ax-text">Butter theme</p></ax-theme
            >
          </div>
        </section>
        <section class="gallery__component" data-gallery-element="TopNav">
          <h3 class="ax-heading ax-heading--3">TopNav</h3>
          <div class="gallery__example" data-gallery-example="default">
            <ax-top-nav label="Primary navigation">
              <span slot="heading"
                ><span class="ax-top-nav__brand-mark" aria-hidden="true">A</span
                ><span>Astryx</span></span
              >
              <a
                slot="start-content"
                class="ax-top-nav__item"
                href="#"
                aria-current="page"
                >Overview</a
              >
              <a slot="start-content" class="ax-top-nav__item" href="#projects"
                >Projects</a
              >
              <ax-button slot="end-content" size="sm">Help</ax-button>
            </ax-top-nav>
          </div>
          <div class="gallery__example" data-gallery-example="centered">
            <ax-top-nav label="Workspace navigation">
              <span slot="heading"
                ><span class="ax-top-nav__brand-mark" aria-hidden="true">W</span
                ><span>Workspace</span></span
              >
              <a
                slot="center-content"
                class="ax-top-nav__item"
                href="#"
                aria-current="page"
                >Home</a
              >
              <ax-button slot="end-content" size="sm">Invite</ax-button>
            </ax-top-nav>
          </div>
        </section>
      </div>
    </template>

    <script>
      const matrix = document.querySelector('#gallery-matrix');
      const template = document.querySelector('#gallery-content');
      const referenceAttributes = [
        'for',
        'aria-controls',
        'aria-labelledby',
        'aria-describedby',
      ];
      let instance = 0;

      function uniquifyReferences(section) {
        const ids = new Map();
        for (const element of section.querySelectorAll('[id]')) {
          const previous = element.id;
          const next = previous + '-' + instance;
          ids.set(previous, next);
          element.id = next;
        }
        for (const element of section.querySelectorAll('*')) {
          for (const attribute of referenceAttributes) {
            if (!element.hasAttribute(attribute)) continue;
            const values = element.getAttribute(attribute).split(/\s+/);
            element.setAttribute(
              attribute,
              values.map(value => ids.get(value) || value).join(' '),
            );
          }
          if (element.hasAttribute('panel-id')) {
            const panelID = element.getAttribute('panel-id');
            element.setAttribute('panel-id', ids.get(panelID) || panelID);
          }
        }
        for (const dialog of section.querySelectorAll('ax-dialog[dialog-id]')) {
          const previous = dialog.getAttribute('dialog-id');
          const next = previous + '-' + instance;
          dialog.setAttribute('dialog-id', next);
          for (const opener of section.querySelectorAll(
            '[data-ax-dialog-open]',
          )) {
            if (opener.getAttribute('data-ax-dialog-open') === previous) {
              opener.setAttribute('data-ax-dialog-open', next);
            }
          }
        }
      }

      for (const theme of ['neutral', 'butter', 'y2k']) {
        for (const mode of ['light', 'dark']) {
          instance += 1;
          const section = document.createElement('section');
          section.className = 'gallery__theme';
          section.dataset.astryxTheme = theme;
          section.dataset.theme = mode;
          section.innerHTML =
            '<h2 class="ax-heading ax-heading--2">' +
            theme +
            ' · ' +
            mode +
            '</h2>';
          section.append(template.content.cloneNode(true));
          uniquifyReferences(section);
          section.addEventListener('submit', event => event.preventDefault());
          matrix.append(section);
        }
      }
    </script>
  </body>
</html>
