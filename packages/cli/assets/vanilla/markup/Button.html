<!-- docs: Trigger an action with primary, secondary, ghost, or destructive emphasis. -->
<!-- variant: primary -->
<button class="ax-button ax-button--primary" type="button">Continue</button>

<!-- variant: secondary -->
<button class="ax-button ax-button--secondary" type="button">Cancel</button>

<!-- variant: ghost -->
<button class="ax-button ax-button--ghost" type="button">Learn more</button>

<!-- variant: destructive -->
<button class="ax-button ax-button--destructive" type="button">Delete</button>

<!-- variant: disabled -->
<button class="ax-button ax-button--primary" type="button" disabled>
  Continue
</button>

<!-- variant: state-loading -->
<div class="ax-stack ax-stack--gap-2">
  <button
    class="ax-button ax-button--primary"
    type="button"
    disabled
    aria-busy="true">
    Saving…
  </button>
  <span class="ax-text ax-text--supporting" role="status">Saving changes…</span>
</div>

<!-- variant: state-success -->
<div class="ax-stack ax-stack--gap-2">
  <button class="ax-button ax-button--primary" type="button">Saved</button>
  <span class="ax-text ax-text--supporting" role="status"
    >Changes saved successfully.</span
  >
</div>
