<!-- docs: Scope a Vanilla Astryx subtree to a loaded theme name and color mode. -->
<!-- attributes:
theme:str|neutral|Loaded Vanilla Astryx theme name.
mode:light,dark,system|system|Light, dark, or operating-system color mode.
-->
<!-- slots:
default*:The themed subtree.
-->
<!-- events:
none
-->
<!-- properties:attrs→camelCase -->
<!-- variant: brand-section -->
<ax-theme theme="brand"><ax-card><ax-heading level="3">Brand workspace</ax-heading><ax-button variant="primary">Continue</ax-button></ax-card></ax-theme>
<!-- variant: nested-dark -->
<ax-theme theme="neutral" mode="dark"><ax-card><ax-heading level="3">Dark tools</ax-heading><ax-text>This subtree is dark inside a light page.</ax-text></ax-card></ax-theme>
