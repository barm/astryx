<!-- docs: Scope a Vanilla Astryx subtree to a loaded theme name and color mode. -->
<!-- attributes:
theme:str|neutral|Loaded Vanilla Astryx theme name.
mode:light,dark,system|system|Light, dark, or operating-system color mode.
-->
<!-- slots:
default*:The themed subtree.
-->
<!-- events:
none
-->
<!-- properties:attrs→camelCase -->
<!-- variant: brand-section -->
<style>@layer astryx-theme{[data-astryx-theme='brand']{--color-accent:light-dark(#6d28d9,#a78bfa);--color-on-accent:light-dark(#fff,#1f1235)}}</style><ax-theme theme="brand"><ax-button variant="primary">Brand action</ax-button></ax-theme>
<!-- variant: nested-dark -->
<ax-theme theme="neutral" mode="dark"><ax-card><p>Loose dark text</p></ax-card></ax-theme>
