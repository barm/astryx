<!-- docs: Represent one selectable view inside an ax-tab-list. -->
<!-- attributes:
label*:str|—|Visible tab label when no child content is authored.
value:str|—|Unique value reported by the parent TabList.
panel-id:str|—|ID of the tab panel controlled by this tab.
is-disabled/disabled:bool|false|Disables the native tab button.
-->
<!-- slots:
default*:Visible tab label and inline content.
-->
<!-- events:
astryx:tab-change:Bubbles with {value} when this tab is activated by its TabList.
-->
<!-- properties:attrs→camelCase -->
<!-- variant: with-panel -->
<ax-tab-list><ax-tab value="a">A</ax-tab></ax-tab-list>
<!-- variant: label -->
<ax-tab-list><ax-tab value="b" label="B"></ax-tab></ax-tab-list>
