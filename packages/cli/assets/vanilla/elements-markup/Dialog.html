<!-- docs: Present a focused task in a native modal dialog with managed focus return; call show()/close() or use is-open. -->
<!-- attributes:
title*:string|—|Visible dialog heading when the title slot is empty.
is-open (open):boolean|absent|Open state reflected from the native dialog.
variant:standard, fullscreen|standard|Standard or fullscreen presentation.
purpose:info, form, required|info|Dismissal policy for info, form, or required tasks.
dialog-id:string|—|ID placed on the inner native dialog for trigger wiring.
-->
<!-- slots:
title*:Required dialog heading.
default:Dialog body content.
footer:Optional dialog actions.
-->
<!-- events:
close:Native dialog close event after is-open is reflected false.
cancel:Native cancel event; prevented for purpose="required".
-->
<!-- methods:
show(): Open the native modal dialog and move focus to its title.
close(): Close the native dialog and restore focus to its opener.
-->
<!-- properties: attrs/aliases: camelCase properties; delegated read-only: returnValue -->
<!-- variant: open-and-close -->
<ax-button data-ax-dialog-open="confirm-dialog">Open dialog</ax-button>
<ax-dialog dialog-id="confirm-dialog">
  <span slot="title">Archive project?</span>
  <p>You can restore this project later.</p>
  <ax-button slot="footer" data-ax-dialog-close>Cancel</ax-button>
</ax-dialog>
<!-- variant: required -->
<ax-dialog purpose="required" title="Accept terms" is-open>
  <p>Review and accept to continue.</p>
</ax-dialog>
