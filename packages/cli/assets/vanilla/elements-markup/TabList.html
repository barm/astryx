<!-- docs: Switch between related in-page views with arrow-key navigation. -->
<!-- attributes:
value: string | — | Selected child tab value, reflected after activation.
size: sm, md, lg | md | Tab size matching TabList size.
layout: hug, fill | hug | Tabs hug content or fill the available width.
orientation: horizontal, vertical | horizontal | Arrow-key and ARIA orientation.
label: string | Views | Accessible label for the native tablist.
-->
<!-- slots:
default: ax-tab children.
panels: Panel elements whose IDs match child panel-id attributes.
-->
<!-- variant: panels -->
<ax-tab-list value="overview" label="Project views"
  ><ax-tab value="overview" panel-id="panel-overview">Overview</ax-tab
  ><ax-tab value="activity" panel-id="panel-activity">Activity</ax-tab>
  <section slot="panels" id="panel-overview">Overview content</section>
  <section slot="panels" id="panel-activity">
    Activity content
  </section></ax-tab-list
>

<!-- variant: fill -->
<ax-tab-list layout="fill"
  ><ax-tab value="one">One</ax-tab><ax-tab value="two">Two</ax-tab></ax-tab-list
>
